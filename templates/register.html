<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <script>
        function validateForm() {
            var name = document.forms["f1"]["name"].value.trim();
            var email = document.forms["f1"]["email"].value.trim();
            var student_id = document.forms["f1"]["student_id"].value.trim();

            // Validate username
            if (name === "") {
                alert("Username cannot be empty.");
                return false;
            }

            // Validate email
            if (email === "") {
                alert("Email cannot be empty.");
                return false;
            }

            // Validate email format
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                return false;
            }

            // Validate student ID
            if (student_id === "") {
                alert("Student ID cannot be empty.");
                return false;
            }

            // If all validations pass
            return true;
        }
    </script>
</head>

<body>

    <h1>Register</h1>

    <form name="f1" action="/register" method="post"
          onsubmit="return validateForm()">

        <label for="name">Username:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="student_id">Student ID:</label>
        <input type="text" id="student_id" name="student_id" required>
        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
